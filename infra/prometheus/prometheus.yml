# prometheus/prometheus.yml — V5.1 Scrape Config
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "ecommerce-ai-v51"
    static_configs:
      - targets: ["api:9091"]   # Bulkhead + Circuit Breaker metrics
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
